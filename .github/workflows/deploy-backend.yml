name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - '!backend/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run the production update script
        env:
          DEPLOY_USER: ${{ secrets.HETZNER_DEPLOY_USER }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_USER"
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@46.224.62.32" \
            /opt/hiveborn/backend/scripts/updateCode.sh "$EXPECTED_REVISION"

  notify-failure:
    name: Email deployment failure
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send failure email
        env:
          SMTP_URL: ${{ secrets.DEPLOY_ALERT_SMTP_URL }}
          SMTP_USERNAME: ${{ secrets.DEPLOY_ALERT_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.DEPLOY_ALERT_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.DEPLOY_ALERT_SMTP_FROM }}
        run: |
          test -n "$SMTP_URL"
          test -n "$SMTP_USERNAME"
          test -n "$SMTP_PASSWORD"
          test -n "$SMTP_FROM"
          {
            printf 'To: kammerloher.andreas@gmail.com\n'
            printf 'From: %s\n' "$SMTP_FROM"
            printf 'Subject: Hiveborn backend deployment failed\n'
            printf '\n'
            printf 'A Hiveborn backend deployment failed.\n\n'
            printf 'Repository: %s\n' "$GITHUB_REPOSITORY"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } | curl \
            --fail \
            --silent \
            --show-error \
            --ssl-reqd \
            --url "$SMTP_URL" \
            --user "$SMTP_USERNAME:$SMTP_PASSWORD" \
            --mail-from "$SMTP_FROM" \
            --mail-rcpt kammerloher.andreas@gmail.com \
            --upload-file -
